<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kick Yayın Bildirici</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h2 data-i18n="title">Kick Yayın Bildirici</h2>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-channels" data-panel="panel-channels" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <span data-i18n="tab_channels">Kanallar</span>
      </button>
      <button class="tab-btn" id="tab-settings" data-panel="panel-settings" type="button">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span data-i18n="tab_settings">Ayarlar</span>
      </button>
    </div>

    <div class="panel active" id="panel-channels">
      <div class="input-group">
        <input 
          type="text" 
          id="channel-input" 
          data-i18n-placeholder="channel_placeholder"
          placeholder="Kanal adı girin..." 
          autocomplete="off"
        />
        <button id="add-channel-btn" data-i18n="add" type="button">Ekle</button>
      </div>

      <div class="search-group">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input 
          type="text" 
          id="search-input" 
          data-i18n-placeholder="search_placeholder"
          placeholder="Takip ettiğin yayıncılarda ara..." 
          autocomplete="off"
        />
      </div>

      <div id="channel-list"></div>
      <div id="search-no-results" class="empty-msg hidden"></div>

      <div id="suggested-section" class="hidden">
        <div class="settings-section-title" data-i18n="suggested_channels">Önerilen Kanallar</div>
        <div id="suggested-list"></div>
      </div>
    </div>

    <div class="panel" id="panel-settings">
      <div class="settings-section-title" data-i18n="general">Genel</div>
      <div class="setting-row">
        <span class="setting-label" data-i18n="show_suggestions">Önerilen kanalları göster</span>
        <label class="switch">
          <input type="checkbox" id="toggle-suggestions" />
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <span class="setting-label" data-i18n="live_notifications">Canlı yayın bildirimleri</span>
        <label class="switch">
          <input type="checkbox" id="toggle-notifications" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting-row setting-row-hours" id="notify-hours-row">
        <div class="hours-label">
          <span class="setting-label" data-i18n="notify_hours">Bildirim saat aralığı</span>
          <span class="hours-hint" data-i18n="notify_hours_hint">Belirtilen saatlerde bildirim al</span>
        </div>
        <div class="hours-controls">
          <select id="notify-start-hour" class="hour-select"></select>
          <span class="hours-sep" data-i18n="hour_sep">ile</span>
          <select id="notify-end-hour" class="hour-select"></select>
        </div>
      </div>

      <button id="test-notification-btn" class="test-btn" data-i18n="test_notification" type="button">Test Bildirimi Gönder</button>

      <div class="settings-section-title" data-i18n="backup">Yedekleme</div>
      <div class="backup-actions">
        <button id="export-btn" class="backup-btn" data-i18n="export_list" type="button">Listeyi Dışa Aktar</button>
        <button id="import-btn" class="backup-btn" data-i18n="import_list" type="button">Listeyi İçe Aktar</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </div>
      <div id="backup-message" class="backup-msg hidden"></div>

      <div class="settings-section-title" data-i18n="language">Dil</div>
      <div class="lang-grid">
        <button type="button" class="lang-btn selected" data-lang="tr">🇹🇷 Türkçe</button>
        <button type="button" class="lang-btn" data-lang="en">🇬🇧 English</button>
      </div>

      <div class="settings-section-title" data-i18n="theme">Tema</div>
      <div class="theme-grid" id="theme-grid"></div>
      <div class="settings-hint" data-i18n="theme_hint">Seçtiğin tema otomatik olarak kaydedilir.</div>

      <div class="settings-section-title" data-i18n="about">Hakkında</div>
      <a href="https://akamusti.github.io/kick-notifier/" class="site-link" target="_blank" rel="noopener noreferrer" data-i18n-title="site_link_title">
        <img src="../icon/icon.png" alt="" class="site-logo" />
        <span class="site-link-text" data-i18n="site_link">Eklentinin web sitesi</span>
        <svg class="site-link-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.41-1.41L17.59 5H14V3zm-8 1h5v2H6v12h12v-5h2v7H4V4z"/></svg>
      </a>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="themes.js"></script>
  <script src="suggestions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
